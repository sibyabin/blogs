version: '3.8'

services:
  jekyll:
    build:
      context: .
      dockerfile: Dockerfile
    image: jekyll-blog:latest
    container_name: jekyll-blog-dev
    ports:
      - "4000:4000"
    volumes:
      # Mount source code for live reload (development)
      - .:/srv/jekyll
      # Exclude vendor and bundle to use container's versions
      - jekyll-bundle:/usr/local/bundle
      - jekyll-gems:/usr/gem
    command: jekyll serve --host 0.0.0.0 --port 4000 --incremental --force_polling --livereload
    environment:
      - JEKYLL_ENV=development
    stdin_open: true
    tty: true
    # Restart policy for development
    restart: unless-stopped

volumes:
  jekyll-bundle:
    driver: local
  jekyll-gems:
    driver: local
